[workflow-service]
system_nexus = true
descriptors = "temporal"

[multi-operation-service]
system_nexus = true

[generic-models]
descriptors = "temporal"

[start-workflow]
descriptors = "temporal"

[proto-backed-showcase]
descriptors = "temporal"

[proto-generic]
languages = ["python", "dotnet", "typescript"]
descriptors = "temporal"

[proto-oneof]
languages = ["python", "dotnet", "typescript"]
descriptors = "temporal"

[notification-service]
languages = ["python", "dotnet", "typescript"]
descriptors = "temporal"

[stream-service]
languages = ["python", "typescript", "dotnet"]
# The sample proto imports the Temporal API messages, so it needs both sets.
descriptors = ["temporal_api.bin", "stream_service.bin"]

# The stream writer, a package apart from the stream service, as in Brook.
[stream-writer]
languages = ["python", "typescript", "dotnet"]
descriptors = ["temporal_api.bin", "stream_service.bin"]

# Brook's Stream service WIT, byte for byte. Only .NET generates it today, since the other SDKs'
# proto packages lack the Stream protos in descriptors/brook/.
[brook-stream-service]
languages = ["dotnet"]
system_nexus = true
descriptors = ["temporal_api.bin", "brook_streams.bin"]

# Brook's writer WIT, byte for byte. It uses records of brook-stream-service. No language generates
# it yet.
[brook-stream-writer]
languages = []
descriptors = ["temporal_api.bin", "brook_streams.bin"]

# A System Nexus operation that returns a resource.
[workflow-handle]
languages = ["python", "dotnet", "typescript"]
system_nexus = true
descriptors = "temporal"
