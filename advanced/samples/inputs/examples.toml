[workflow-service]
system_nexus = true
descriptors = "temporal"

[multi-operation-service]
system_nexus = true

[generic-models]
descriptors = "temporal"

[start-workflow]
descriptors = "temporal"

[proto-backed-showcase]
descriptors = "temporal"

[proto-generic]
languages = ["python", "dotnet", "typescript"]
descriptors = "temporal"

[proto-oneof]
languages = ["python", "dotnet", "typescript"]
# The sample proto has a oneof with an enum case, which no Temporal API message has.
descriptors = ["temporal_api.bin", "oneofsample.bin"]

[notification-service]
languages = ["python", "dotnet", "typescript"]
descriptors = "temporal"

# Brook's Stream service WIT, byte for byte. Its records bind to the Stream protos of
# temporalio/api#895 in descriptors/streams/, which no SDK has yet. So Python imports them from the
# sample's own package, and the other Temporal protos from temporalio.
[stream-service]
languages = ["python", "typescript", "dotnet"]
descriptors = ["temporal_api.bin", "streams.bin"]

[stream-service.python_proto_modules]
"temporal/api/stream/" = "streamprotos.temporal.api.stream"
"temporal/api/streamservice/" = "streamprotos.temporal.api.streamservice"
"temporal/api/enums/v1/stream.proto" = "streamprotos.temporal.api.enums.v1.stream_pb2"
"temporal/sdk/streams/" = "streamprotos.temporal.sdk.streams"

# Brook's writer WIT, byte for byte. It uses records of stream-service, and Brook's runtime proto.
# Python doesn't generate it yet, since its caller doesn't import every type that it uses.
[stream-writer]
languages = ["typescript", "dotnet"]
descriptors = ["temporal_api.bin", "streams.bin"]

# A System Nexus operation that returns a resource.
[workflow-handle]
languages = ["python", "dotnet", "typescript"]
system_nexus = true
descriptors = "temporal"
