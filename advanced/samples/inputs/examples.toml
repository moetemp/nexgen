[workflow-service]
system_nexus = true
descriptors = "temporal"

# Python also gets the client target, which takes a generic operation too.
[multi-operation-service]
system_nexus = true
targets = ["workflow", "client"]
descriptors = "temporal"

[generic-models]
descriptors = "temporal"

[start-workflow]
descriptors = "temporal"

[proto-backed-showcase]
descriptors = "temporal"

[proto-generic]
languages = ["python", "dotnet", "typescript"]
descriptors = "temporal"

[proto-oneof]
languages = ["python", "dotnet", "typescript"]
# The sample proto has a oneof with an enum case, which no Temporal API message has.
descriptors = ["temporal_api.bin", "oneofsample.bin"]

[notification-service]
languages = ["python", "dotnet", "typescript"]
descriptors = "temporal"

# Brook's Stream service WIT. Its read poll names the client target, and it takes directives that
# Brook's WIT takes later. Its records bind to the Stream protos of temporalio/api#895 in
# descriptors/streams/, which no SDK has yet. So Python imports them from the sample's own package,
# and the other Temporal protos from temporalio. Python also gets the client target, so one Stream
# class serves Workflow code and clients.
[stream-service]
languages = ["python", "typescript", "dotnet"]
targets = ["workflow", "client"]
descriptors = ["temporal_api.bin", "streams.bin"]

[stream-service.python_proto_modules]
"temporal/api/stream/" = "streamprotos.temporal.api.stream"
"temporal/api/streamservice/" = "streamprotos.temporal.api.streamservice"
"temporal/api/enums/v1/stream.proto" = "streamprotos.temporal.api.enums.v1.stream_pb2"
"temporal/sdk/streams/" = "streamprotos.temporal.sdk.streams"

# Brook's writer WIT, with the directives that Brook's WIT takes later. It uses records of
# stream-service, and Brook's runtime proto. Python also gets the client target, which Brook uses.
[stream-writer]
languages = ["python", "typescript", "dotnet"]
targets = ["workflow", "client"]
descriptors = ["temporal_api.bin", "streams.bin"]

[stream-writer.python_proto_modules]
"temporal/api/stream/" = "streamprotos.temporal.api.stream"
"temporal/api/streamservice/" = "streamprotos.temporal.api.streamservice"
"temporal/api/enums/v1/stream.proto" = "streamprotos.temporal.api.enums.v1.stream_pb2"
"temporal/sdk/streams/" = "streamprotos.temporal.sdk.streams"

# Polled operations and a polled resource method, in a service with an endpoint and in one with no
# endpoint. Only Python generates the iterators.
[poll-service]
languages = ["python"]
targets = ["workflow", "client"]
descriptors = "temporal"

# The request flattens two fields of its heartbeat, and fills the others from the request.
[worker-shutdown]
descriptors = "temporal"

# A client starts the `async` operation and waits for its result later. Only Python has the client
# target.
[client-calls]
languages = ["python"]
targets = ["workflow", "client"]

# A System Nexus operation that returns a resource. Python gets only the client target.
[workflow-handle]
languages = ["python", "dotnet", "typescript"]
system_nexus = true
targets = ["client"]
descriptors = "temporal"
